[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
celery = {version = ">=5.6.3", extras = ["redis"]}
celery-redbeat = ">=2.2.0"
nldcsc = {version = "==0.3.77", extras = ["flask_managers", "flask_middleware", "loggers", "http_apis", "sso"]}
flask = "3.1.3"
flask-migrate = "4.0.7"
flask-wtf = "1.2.2"
flask-sqlalchemy = "3.1.1"
flask-login = "0.6.3"
flask-restx = "1.3.0"
flask-socketio = "5.4.1"
aiohttp = "3.13.5"
sqlalchemy = "2.0.36"
werkzeug = "3.1.6"
wtforms = "3.2.1"
jinja2 = "3.1.6"
python-dotenv = "^1.2.2"
scikit-image = "^0.24.0"
numpy = "^2.4.4"
opencv-python = "^4.10.0.84"
pillow = "^12.2.0"
selenium = "^4.26.1"
pyvirtualdisplay = "^3.0"
mysqlclient = "^2.2.6"
eventlet = "^0.41.0"
dataclasses-json = "^0.6.7"
python-redis-cache = "^4.0.1"
nltk = "^3.9.4"
pytesseract = "^0.3.13"
pyyaml = "^6.0.2"
gevent = "^26.4.0"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
sphinx = "^8.2.3"
furo = "^2025.12.19"
myst-parser = "^5.0.0"
sphinx-copybutton = "^0.5.2"
sphinx-inline-tabs = "^2025.12.21.14"
sphinx_design = "^0.7.0"
nldcsc = {version = ">=0.3.77", extras = ["loggers"]}
