[tool.poetry]
package-mode = false

[tool.poetry.dependencies]
python = "^3.11"
celery = {version = ">=5.6.3", extras = ["redis"]}
celery-redbeat = ">=2.4.2"
nldcsc = {version = "==1.0.0", extras = ["flask_managers", "flask_middleware", "loggers", "http_apis", "sso"]}
flask = "3.1.3"
flask-migrate = "4.1.0"
flask-wtf = "1.3.0"
flask-sqlalchemy = "3.1.1"
flask-login = "0.6.3"
flask-restx = "1.3.2"
flask-socketio = "5.7.0"
aiohttp = "3.14.5"
sqlalchemy = "2.1.4"
werkzeug = "3.1.9"
wtforms = "3.2.2"
jinja2 = "3.1.6"
python-dotenv = "^1.2.4"
scikit-image = "^0.26.0"
numpy = "^2.4.6"
opencv-python = "^5.0.0.93"
pillow = "^12.3.0"
selenium = "^4.51.0"
pyvirtualdisplay = "^3.0"
mysqlclient = "^2.3.0"
eventlet = "^0.41.2"
dataclasses-json = "^0.6.7"
python-redis-cache = "^4.0.1"
nltk = "^3.10.3"
pytesseract = "^0.3.13"
pyyaml = "^6.0.2"
gevent = "^26.9.0"

[tool.poetry.group.docs]
optional = true

[tool.poetry.group.docs.dependencies]
sphinx = "^9.0.4"
furo = "^2025.12.19"
myst-parser = "^5.1.0"
sphinx-copybutton = "^0.5.2"
sphinx-inline-tabs = "^2025.12.21.14"
sphinx_design = "^0.7.0"
nldcsc = {version = ">=1.0.0", extras = ["loggers"]}
