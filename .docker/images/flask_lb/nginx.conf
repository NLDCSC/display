upstream websocket_nodes {
    ip_hash;

    server display-flask_ws-1:5050;
}

upstream webserver_nodes {
    server display-flask_web-1:5050;
}

server {
    listen 80;
    server_name _;

    location / {
        include proxy_params;
        proxy_pass http://webserver_nodes;
        fastcgi_buffers         16  16k;
        fastcgi_buffer_size         32k;
        proxy_buffer_size          128k;
        proxy_buffers            4 256k;
        proxy_busy_buffers_size    256k;
    }

    location /static {
        alias /app/static;
        expires 0;
    }

    location /socket.io {
        include proxy_params;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_pass http://websocket_nodes/socket.io;
    }
}
