version: '3.5'

services:

  ha_proxy:
    image: display-splash-ha_proxy
    build:
      context: .
      dockerfile: ./ha_proxy
    hostname: haproxy
    restart: always
    env_file:
      - .env
    ports:
      - 8050:8050
    networks:
      - frontend
      - backend

  splash:
    image: display-splash
    command: --maxrss 4096 --disable-browser-caches
    build:
      context: .
      dockerfile: ./splash_screen
    deploy:
      replicas: 3
    restart: always
    env_file:
      - .env
    networks:
      - backend

