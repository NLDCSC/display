version: '3.5'

services:

  ha_proxy:
    image: display-splash-ha_proxy
    build:
      context: .
      dockerfile: ./ha_proxy
    hostname: haproxy
    restart: always
    env_file:
      - .env
    ports:
      - 8050:8050
    networks:
      - frontend
      - backend

  splash:
    image: display-splash
    command: --maxrss 4096 --disable-browser-caches
    build:
      context: .
      dockerfile: ./splash_screen
    deploy:
      replicas: 5
    restart: always
    env_file:
      - .env
    networks:
      - backend
    healthcheck:
      test: curl --fail http://localhost:8050 || exit 1
      interval: 30s
      timeout: 5s
      retries: 1
      start_period: 20s

  autoheal:
    image: willfarrell/autoheal:latest
    hostname: autoheal
    restart: always
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    env_file:
      - .env
    networks:
      - backend

networks:
  frontend:
  backend:
