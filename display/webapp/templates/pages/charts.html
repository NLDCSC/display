{% extends "chart_base.html" %}

{% block head_css %}
    <link href="{{ url_for('static', filename='css/defacement_chart.min.css') }}" rel="stylesheet"/>
{% endblock %}

{% block head_scripts %}
    <script type="text/javascript" src="{{ url_for('static', filename='js/plotly/plotly.min.js') }}"></script>
{% endblock %}

{% block body %}
    <div id="defacement_chart"></div>
{% endblock %}

{% block body_scripts %}
    <script>
        var trace1 = {
            x: [1, 2, 3, 4],
            y: [10, 15, 13, 17],
            type: 'scatter',
            name: "BT01"
        };

        var trace2 = {
            x: [1, 2, 3, 4],
            y: [16, 5, 11, 9],
            type: 'scatter',
            name: "BT02"
        };

        var data = [trace1, trace2];

        Plotly.newPlot('defacement_chart', data);
    </script>
{% endblock %}
