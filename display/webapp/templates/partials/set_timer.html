<div class="popup_timer">
    <h3>Tab rotation:</h3>
    <button class="popup-close" id="btn_timer">&times;</button>
    <hr class="ruler">
    <form id="timer_form" action="">
        <div class="form-group">
            <label for="timer_int">Set Timer interval:</label>
            <input type="number" class="form-control" id="timer_int" name="timer_interval" min="15">
        </div>
        <div class="form-group">
            <input type="submit" class="btn btn-outline-success float-right mr-2" value="Set!">
        </div>
    </form>
</div>
