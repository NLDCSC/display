<ul class="nav nav-tabs" id="myTab" role="tablist">
    {% for key in  display_sources %}
        <li class="nav-item" role="presentation">
            <button class="nav-link {% if loop.first %} active {% endif %}" id="tab_{{ key|md5 }}" data-name="{{ key }}" data-bs-toggle="tab" data-bs-target="#content_{{ key|md5 }}" type="button" role="tab" aria-controls="home" aria-selected="true">
                {{ key }}</button>
        </li>
    {% endfor %}
</ul>
<div class="tab-content" id="myTabContent">
    {% for key in  display_sources %}
        <div class="tab-pane fade {% if loop.first %} show active {% endif %}" id="content_{{ key|md5 }}" role="tabpanel" aria-labelledby="{{ key|md5 }}-tab">
            {% for row in display_sources[key]|batch(6) %}
                <div class="row content-row">
                    {% for each in row %}
