{% for row in display_sources[key]|batch(6) %}
    {% set top_loop = loop.index %}
    <div id="row_{{ key|md5 }}_{{ top_loop }}" class="row content-row" data-tab-hash="{{ key|md5 }}" data-row-number="{{ top_loop }}">
        {% for each in row %}

                    <div>{% if each["alt_header"] is defined %}{{ each['alt_header']|upper }}{% else %}{{ each['header'] }}{% endif %}<span id="mod_time_{{ key|md5 }}_{{ each['url']|md5 }}" class="mod-time">never</span>
