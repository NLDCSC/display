---
name: 'Display'

services:

  flask_web:
    image: display-dev-flask_web
    build:
      context: .
      dockerfile: .docker/images/flask/dockerfile-flask
      args:
        PORT: 5050
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    develop:
      watch:
        - action: sync
          path: ./display/
          target: /app/display/
          ignore:
            - celery_app/
    depends_on:
      - mysql
      - redis
    restart: always
    expose:
      - 5050
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=TRUE
    volumes:
      - "./docker-data/flask:/app/data"
    networks:
      backend:
        ipv4_address: 172.16.30.7

  ha_proxy:
    image: display-splash-ha_proxy
    build:
      context: .
      dockerfile: .docker/images/haproxy/ha_proxy
    hostname: haproxy
    restart: always
    env_file:
      - .env
    ports:
      - "127.0.0.1:8050:8050"
    networks:
      backend:
        ipv4_address: 172.16.30.6

  splash:
    image: display-splash
    command: --maxrss 4096 --disable-browser-caches
    build:
      context: .
      dockerfile: .docker/images/splash/splash_screen
    deploy:
      replicas: 15
    restart: always
    env_file:
      - .env
    networks:
      - backend
    healthcheck:
      test: curl --fail http://localhost:8050 || exit 1
      interval: 30s
      timeout: 5s
      retries: 1
      start_period: 20s

  celery_daemon:
    image: display-dev-celery_daemon
    build:
      context: .
      dockerfile: .docker/images/celery_daemon/dockerfile-celery_daemon
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    develop:
      watch:
        - action: sync
          path: ./display/
          target: /app/display/
          ignore:
            - webapp/templates/
            - webapp/static/
            - webapp/home/
            - webapp/auth/
            - webapp/admin/
    depends_on:
      - redis
      - mysql
    restart: always
    security_opt:
      - seccomp:unconfined
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=TRUE
    volumes:
      - "./docker-data/flask:/app/data"
    networks:
      backend:
        ipv4_address: 172.16.30.11

  celery_beat:
    image: display-dev-celery_beat
    build:
      context: .
      dockerfile: .docker/images/celery_beat/dockerfile-celery_beat
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    develop:
      watch:
        - action: sync+restart
          path: ./display/
          target: /app/display/
          ignore:
            - webapp/templates/
            - webapp/static/
            - webapp/home/
            - webapp/auth/
            - webapp/admin/
    depends_on:
      - redis
      - mysql
    restart: always
    security_opt:
      - seccomp:unconfined
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=TRUE
    volumes:
      - "./docker-data/flask:/app/data"
    networks:
      - backend

  redis:
    image: display-dev-redis
    hostname: redis
    restart: always
    build:
      context: .
      dockerfile: .docker/images/redis/dockerfile-redis
    volumes:
      - "redis_data:/data"
    expose:
      - 6379
    networks:
      backend:
        ipv4_address: 172.16.30.4

  mysql:
    image: display-dev-mysql
    build:
      context: .
      dockerfile: .docker/images/mysql/dockerfile-mysql
    hostname: mysql
    restart: always
    env_file:
      - .env
    ports:
      - "3306:3306"
    security_opt:
      - seccomp:unconfined
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      backend:
        ipv4_address: 172.16.30.5

networks:
  backend:
    name: display_development_backend
    driver_opts:
      com.docker.network.bridge.host_binding_ipv4: "172.16.30.1"
    ipam:
      config:
        - subnet: 172.16.30.0/24

volumes:
  mysql_data:
  redis_data:
