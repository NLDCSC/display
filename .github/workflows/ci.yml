name: CI

permissions:
  contents: write
  packages: read
  pull-requests: write

on:
  push:
    branches:
      - master
  pull_request: null

jobs:
  test:
    uses: NLDCSC/DCSC-shared/.github/workflows/ci-python.yml@a9481127a8524e2fbd1fda1ef8ef226e9abc59aa # v13.11.0
    with:
      python-version: '3.14'
      min-coverage: 70

  security:
    uses: NLDCSC/DCSC-shared/.github/workflows/ci-security.yml@a9481127a8524e2fbd1fda1ef8ef226e9abc59aa # v13.11.0
    secrets:
      GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}

  check:
    uses: NLDCSC/DCSC-shared/.github/workflows/ci-conventional-commits.yml@a9481127a8524e2fbd1fda1ef8ef226e9abc59aa # v13.11.0

  container:
    needs:
      - security
      - test
      - check
    permissions:
      contents: read
      packages: write
      id-token: write
      pull-requests: write
    uses: NLDCSC/DCSC-shared/.github/workflows/ci-container.yml@a9481127a8524e2fbd1fda1ef8ef226e9abc59aa # v13.11.0
    with:
      dockerfile-glob: |-
        .docker/images/celery_beat/dockerfile-celery_beat
        .docker/images/celery_daemon/dockerfile-celery_daemon
        .docker/images/flask/dockerfile-flask
        .docker/images/init_db/dockerfile-init-db
        .docker/images/mysql/dockerfile-mysql
        .docker/images/node/dockerfile-node
        .docker/images/redis/dockerfile-redis
    secrets:
      chainguard-identity: ${{ secrets.CHAINGUARD_IDENTITY }}

  black:
    permissions:
      contents: write
      pull-requests: write
      checks: write
      issues: write
    uses: NLDCSC/DCSC-shared/.github/workflows/ci-lint-black.yml@a9481127a8524e2fbd1fda1ef8ef226e9abc59aa # v13.11.0
    with:
      head-repository: ${{ github.event.pull_request.head.repo.full_name || '' }}

  release-gate:
    needs:
      - security
      - test
      - check
      - container
    permissions:
      contents: write
      id-token: write
    uses: NLDCSC/DCSC-shared/.github/workflows/release-gate.yml@a9481127a8524e2fbd1fda1ef8ef226e9abc59aa # v13.11.0
    with:
      python-version: '3.14'
    secrets:
      releaser-client-id: ${{ secrets.RELEASER_CLIENT_ID }}
      releaser-app-private-key: ${{ secrets.RELEASER_APP_PRIVATE_KEY }}

  release-container:
    permissions:
      contents: write
      packages: write
      id-token: write
    uses: NLDCSC/DCSC-shared/.github/workflows/release-container.yml@a9481127a8524e2fbd1fda1ef8ef226e9abc59aa # v13.11.0
    with:
      version: ${{ github.event.release.tag_name }}
      dockerfile-glob: |-
        .docker/images/celery_beat/dockerfile-celery_beat
        .docker/images/celery_daemon/dockerfile-celery_daemon
        .docker/images/flask/dockerfile-flask
        .docker/images/init_db/dockerfile-init-db
        .docker/images/mysql/dockerfile-mysql
        .docker/images/node/dockerfile-node
        .docker/images/redis/dockerfile-redis
    secrets:
      chainguard-identity: ${{ secrets.CHAINGUARD_IDENTITY }}

  docs:
    permissions:
      contents: read
      pages: write
      id-token: write
    uses: NLDCSC/DCSC-shared/.github/workflows/deploy-docs-pages.yml@a9481127a8524e2fbd1fda1ef8ef226e9abc59aa # v13.11.0
    with:
      python-version: '3.14'
      poetry-version: 2.5.1
      install-command: poetry install --only docs
      build-command: poetry run make -C docs html
      artifact-path: docs/build/html
